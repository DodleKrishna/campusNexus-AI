[project]
name = "campusnexus"
version = "0.1.0"
description = "CampusNexus AI -- goal-driven multi-agent campus operating system (Phase 1: core contracts)"
readme = "CLAUDE.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "chromadb>=0.5,<2",
    "pyyaml>=6.0,<7",
    "langgraph>=0.2,<2",
    # Pinned below langgraph's own >=3.5.0 floor: on this dev machine, the
    # xxhash 3.5+ native DLL (pulled in transitively via langchain-core ->
    # langsmith) is blocked by a Windows Application Control policy
    # ("DLL load failed ... blocked"). xxhash 3.4.x provides the same API
    # langsmith/langgraph actually use, confirmed by a full StateGraph
    # compile/invoke/checkpoint round-trip. Safe to relax if that policy
    # isn't present in your environment.
    "xxhash>=3.0,<3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Only required to run the Academic Agent against the real Anthropic API
# (CAMPUSNEXUS_LLM_PROVIDER=anthropic). The default offline/mock LLM mode --
# used by the entire test suite, the demo runner, and eval -- never imports
# this package (see app/llm/providers/anthropic_provider.py's lazy import).
llm = [
    # >=0.49: the provider always sends an explicit ``thinking`` config.
    "anthropic>=0.49,<1",
]
# Phase 8: the FastAPI application layer + Streamlit demo UI. Kept as a
# separate extra so a pure-backend/test install (`pip install -e ".[dev]"`)
# stays lean -- nothing under app/ (agents, rules, verification, etc.) ever
# imports fastapi/streamlit. uvicorn/httpx are already pulled in transitively
# (via langgraph/langsmith and chromadb respectively) but are declared
# explicitly here since app/api/ now imports them directly.
app = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "streamlit>=1.35,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

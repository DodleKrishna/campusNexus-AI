[project]
name = "campusnexus"
version = "0.1.0"
description = "CampusNexus AI -- goal-driven multi-agent campus operating system (Phase 1: core contracts)"
readme = "CLAUDE.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "chromadb>=0.5,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

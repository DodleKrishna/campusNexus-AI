# Phase 9: keep the local demo UI local. Streamlit otherwise binds to every
# network interface, exposing a UI with a no-authentication identity switcher
# to the LAN. Override deliberately with --server.address if ever needed.
[server]
address = "127.0.0.1"
# No first-run email prompt (it blocks a fresh machine's startup window) and no
# auto-opened browser tab -- scripts/start_demo.ps1 opens the UI once it's up.
headless = true

[browser]
gatherUsageStats = false
